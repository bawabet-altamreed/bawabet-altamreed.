<!-- =====================================================
     BAWABET ALTAMREED
     GLOBAL HEADER
     ===================================================== -->

<header class="site-header" id="site-header">

    <div class="container header-inner">

        <!-- LOGO -->
        <a
            href="index.html"
            class="site-logo"
            aria-label="بوابة التمريض - الرئيسية"
        >

            <span class="site-logo-icon">
                🩺
            </span>

            <span class="site-logo-content">

                <strong class="site-logo-title">
                    بوابة التمريض
                </strong>

                <small class="site-logo-subtitle">
                    المرجع الشامل للتمريض
                </small>

            </span>

        </a>


        <!-- DESKTOP NAVIGATION -->

        <nav
            class="desktop-navigation"
            aria-label="القائمة الرئيسية"
            data-navigation
        >
            <!--
                Navigation is generated automatically
                by js/app.js
            -->
        </nav>


        <!-- HEADER ACTIONS -->

        <div class="header-actions">

            <!-- SEARCH -->

            <button
                type="button"
                class="header-action search-trigger"
                data-search-toggle
                aria-label="فتح البحث"
                title="بحث"
            >
                🔍
            </button>


            <!-- MOBILE MENU -->

            <button
                type="button"
                class="header-action mobile-menu-button"
                data-mobile-menu-button
                aria-label="فتح القائمة"
                aria-expanded="false"
                aria-controls="mobile-navigation"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>

    </div>


    <!-- MOBILE NAVIGATION -->

    <div
        class="mobile-navigation"
        id="mobile-navigation"
        data-mobile-menu
    >

        <div class="container">

            <div
                class="mobile-navigation-links"
                data-navigation
            >
                <!-- Generated by app.js -->
            </div>


            <!-- MOBILE SEARCH -->

            <div class="mobile-search search-panel">

                <form
                    class="search-form"
                    data-search-form
                >

                    <div class="search-field">

                        <span
                            class="search-field-icon"
                            aria-hidden="true"
                        >
                            🔍
                        </span>

                        <input
                            type="search"
                            name="q"
                            placeholder="ابحث في بوابة التمريض..."
                            autocomplete="off"
                            data-global-search
                            aria-label="البحث في بوابة التمريض"
                        >

                        <button
                            type="submit"
                            class="search-submit"
                            aria-label="بحث"
                        >
                            بحث
                        </button>

                    </div>

                </form>

            </div>


            <!-- MOBILE QUICK LINKS -->

            <div class="mobile-quick-links">

                <a href="pages/drugs.html">
                    💊
                    <span>دليل الأدوية</span>
                </a>

                <a href="pages/dictionary.html">
                    📖
                    <span>قاموس التمريض</span>
                </a>

                <a href="pages/skills.html">
                    🩺
                    <span>مهارات التمريض</span>
                </a>

                <a href="pages/tools.html">
                    🧮
                    <span>الأدوات التمريضية</span>
                </a>

            </div>

        </div>

    </div>


    <!-- DESKTOP SEARCH OVERLAY -->

    <div
        class="search-overlay"
        data-search-overlay
        aria-hidden="true"
    >

        <div class="container search-overlay-container">

            <div class="search-overlay-header">

                <div>

                    <span class="search-overlay-label">
                        🔍 البحث في بوابة التمريض
                    </span>

                    <h2>
                        ابحث عن أي معلومة تمريضية
                    </h2>

                </div>


                <button
                    type="button"
                    class="search-close"
                    data-search-close
                    aria-label="إغلاق البحث"
                >
                    ✕
                </button>

            </div>


            <form
                class="global-search-form search-panel"
                data-search-form
            >

                <div class="search-field search-field-large">

                    <span
                        class="search-field-icon"
                        aria-hidden="true"
                    >
                        🔍
                    </span>

                    <input
                        type="search"
                        name="q"
                        placeholder="دواء، مصطلح، مهارة، مقال..."
                        autocomplete="off"
                        data-global-search
                        aria-label="البحث"
                    >

                    <button
                        type="submit"
                        class="search-submit"
                    >
                        بحث
                    </button>

                </div>

            </form>


            <div class="search-suggestions">

                <span>
                    بحث سريع:
                </span>

                <a href="pages/drugs.html">
                    💊 الأدوية
                </a>

                <a href="pages/dictionary.html">
                    📖 المصطلحات
                </a>

                <a href="pages/skills.html">
                    🩺 المهارات
                </a>

                <a href="pages/articles.html">
                    📚 المقالات
                </a>

            </div>

        </div>

    </div>

</header>
