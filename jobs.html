<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>وظائف التمريض | بوابة التمريض</title>

    <meta name="description" content="صفحة وظائف التمريض من بوابة التمريض. سيتم إضافة فرص عمل موثوقة عند توفرها.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #1e293b;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0b3d62, #087ea4);
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: 35px auto;
        }

        .empty-card {
            background: white;
            border-radius: 18px;
            padding: 45px 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #eaf7fb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .empty-card h2 {
            color: #0b3d62;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .empty-card p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
        }

        .notice {
            margin-top: 25px;
            background: #f1f7fa;
            border-right: 4px solid #087ea4;
            padding: 15px;
            border-radius: 10px;
            color: #475569;
            line-height: 1.7;
            font-size: 14px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #087ea4;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #0b3d62;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 23px;
            }

            .empty-card {
                padding: 35px 18px;
            }

            .empty-card h2 {
                font-size: 21px;
            }

            .empty-card p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>💼 وظائف التمريض</h1>

    <p>
        فرص العمل والوظائف في مجال التمريض
    </p>

</header>


<main class="container">

    <section class="empty-card">

        <div class="icon">
            💼
        </div>

        <h2>
            لا توجد وظائف متاحة حاليًا
        </h2>

        <p>
            لا توجد فرص عمل منشورة على بوابة التمريض
            في الوقت الحالي.
        </p>

        <div class="notice">

            📌 سيتم إضافة فرص عمل موثوقة إلى هذه الصفحة
            عند توفرها.

        </div>

        <a href="index.html" class="back-btn">
            العودة للرئيسية
        </a>

    </section>

</main>

</body>
</html>
